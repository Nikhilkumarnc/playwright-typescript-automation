name: Playwright TypeScript Tests # Name displayed in GitHub Actions.

on:
  workflow_dispatch: # Allow manual execution from GitHub.
  push:
    branches: [main] # Run automatically when code is pushed to main.

jobs:
  playwright-tests:
    timeout-minutes: 60 # Cancel the job if it exceeds 60 minutes.
    runs-on: windows-latest # Use a GitHub-hosted Windows runner.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Download the repository.

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Configure Node.js.
        with:
          node-version: 22 # Use Node.js 22.

      - name: Set up Java
        uses: actions/setup-java@v4 # Configure Java for the Allure CLI.
        with:
          distribution: temurin # Use the Eclipse Temurin distribution.
          java-version: "17" # Use Java 17.

      - name: Install dependencies
        run: npm ci # Install project dependencies from package-lock.json.

      - name: Install Playwright browsers
        run: npx playwright install # Install the browsers required by Playwright.

      - name: Run Playwright tests
        run: npx playwright test --workers=2 # Run tests with up to two workers.
        env:
          CI: true # Identify this as a CI environment.
          TEST_ENV: qa # Select the QA environment.

      - name: Generate Allure HTML report
        if: always() && hashFiles('allure-results/**') != ''
        run: npx allure generate allure-results --clean -o allure-report
        # Convert raw Allure results into a browsable HTML report.

      - name: Upload Playwright HTML report
        if: always() # Attempt upload even if tests fail.
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report # Artifact containing Playwright's HTML report.
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always() && hashFiles('allure-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report # Artifact containing the generated Allure HTML report.
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure raw results
        if: always() && hashFiles('allure-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results # Preserve raw results for later analysis.
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
