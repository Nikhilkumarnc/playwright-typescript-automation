name: Playwright TypeScript Tests # Name displayed in GitHub Actions.

on:
  workflow_dispatch: # Allow manual execution from GitHub.
  push:
    branches: [main] # Run automatically when code is pushed to main.

jobs:
  playwright-tests:
    name: Playwright Tests - ${{ matrix.os }} # Display the OS in each job.
    timeout-minutes: 60 # Cancel a job if it exceeds 60 minutes.

    strategy:
      fail-fast: false # Let other OS jobs finish if one OS fails.
      matrix:
        os: [windows-latest] # Create three parallel jobs.

    runs-on: ${{ matrix.os }} # Run each job on its selected operating system.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Download the repository source code.

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Configure Node.js.
        with:
          node-version: 22 # Use Node.js 22 on all operating systems.
          cache: npm # Cache npm dependencies to speed up subsequent runs.

      - name: Set up Java
        uses: actions/setup-java@v4 # Configure Java for the Allure CLI.
        with:
          distribution: temurin # Use Eclipse Temurin.
          java-version: "17" # Use Java 17.

      - name: Install dependencies
        run: npm ci # Install exact project dependencies from package-lock.json.

      - name: Install Allure CLI
        run: npm install --global allure-commandline # Install the Allure report generator.

      - name: Install Playwright system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install-deps # Install required browser libraries on Ubuntu.

      - name: Install Playwright browsers
        run: npx playwright install # Install Playwright browser binaries.

      - name: Run Playwright tests
        run: npm run all-tests:qa -- --workers=2 # Run the QA npm script with two workers.
        env:
          CI: "true" # Identify this as a CI execution.
          TEST_ENV: qa # Select the QA environment.

      - name: Generate Allure HTML report
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        run: allure generate allure-results --clean -o allure-report # Convert raw results into HTML.

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.os }} # Keep reports separate by OS.
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: ${{ always() && hashFiles('allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ matrix.os }} # Upload this OS's Allure report.
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure raw results
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results-${{ matrix.os }} # Preserve raw test evidence per OS.
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
