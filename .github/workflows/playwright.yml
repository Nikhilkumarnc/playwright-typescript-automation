name: Playwright TypeScript Tests

on:
  workflow_dispatch:
    inputs:
      test_env:
        description: "Choose the target environment"
        type: choice
        options:
          - qa
          - uat
        default: qa
        required: true

      test_suite:
        description: "Choose the test suite to execute"
        type: choice
        options:
          - all-tests
          - register-user
          - ui-basics
          - login-fixture
          - handle-child-page
          - parameterized-test
          - get-products-name
          - parallel-test
          - login-api
          - multiple-storage
          - network-intercept-response
          - e2e
          - e2e-cross-parallel
        default: all-tests
        required: true

      test_grep:
        description: "Optional test title filter"
        type: string
        default: ""
        required: false

      workers:
        description: "Maximum Playwright workers PER OS"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "6"
        default: "2"
        required: true

  # push:
  #   branches: [main]

jobs:
  playwright-tests:
    name: ${{ matrix.os }} - Playwright Tests

    strategy:
      fail-fast: false # Let other OS jobs finish if one OS fails.
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }} # Run the same tests on each OS.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci # Install locked project dependencies.

      - name: Install Allure CLI
        run: npm install --global allure-commandline

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browsers (Windows and macOS)
        if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit

      - name: Run selected Playwright tests
        shell: pwsh
        env:
          CI: "true"
          TEST_ENV: ${{ inputs.test_env || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all-tests' }}
          TEST_GREP: ${{ inputs.test_grep || '' }}
          WORKERS: ${{ inputs.workers || '2' }}
        run: |
          # Build the npm script name, such as all-tests:qa.
          $scriptName = "$env:TEST_SUITE`:$env:TEST_ENV"

          # Set the worker limit for this OS job.
          $playwrightArgs = @("--workers=$env:WORKERS")

          # Add a title filter only when one was supplied.
          if (-not [string]::IsNullOrWhiteSpace($env:TEST_GREP)) {
            $playwrightArgs += @("--grep", $env:TEST_GREP)
          }

          # Run the selected suite with the requested options.
          npm run $scriptName -- @playwrightArgs

          # Preserve the test command's failure exit code.
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Generate Allure HTML report
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        shell: pwsh
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.os }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: ${{ always() && hashFiles('allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-${{ matrix.os }}
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure raw results
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-raw-results-${{ matrix.os }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14
