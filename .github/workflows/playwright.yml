name: Playwright TypeScript Tests # Name displayed in GitHub Actions.

on:
  workflow_dispatch: # Allow you to start tests manually from GitHub.
  push:
    branches: [main] # Also run tests whenever code is pushed to main.

jobs:
  playwright-tests:
    timeout-minutes: 60 # Cancel the job if it runs longer than 60 minutes.
    runs-on: ubuntu-latest # Run the tests on a GitHub-hosted Linux runner.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Download your GitHub repository code.

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Install and configure Node.js.
        with:
          node-version: 22 # Use Node.js 22.

      - name: Install dependencies
        run: npm ci # Install exact dependencies from package-lock.json.

      - name: Install Playwright browsers
        run: npx playwright install --with-deps # Install browsers and Linux dependencies.

      - name: Run Playwright tests
        run: npx playwright test --workers=2 # Run tests using up to two workers.
        env:
          CI: true # Identify the environment as CI.
          TEST_ENV: qa # Select the QA environment.

      - name: Upload Playwright HTML report
        if: always() # Upload the report even when tests fail.
        uses: actions/upload-artifact@v4 # Store the report with the workflow run.
        with:
          name: playwright-html-report # Artifact name shown on GitHub.
          path: playwright-report/ # Folder generated by the HTML reporter.
          if-no-files-found: warn # Warn if no HTML report was generated.
          retention-days: 14 # Keep the artifact for 14 days.
